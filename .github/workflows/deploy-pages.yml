name: Deploy to Cloudflare Pages

# The tool's home is pitch.dog/email-my-deck/, which ships from
# bomkino/pitchdog-cloudflare-sites. This standalone deploy is optional, so it
# only runs by hand, once the Cloudflare secrets below are set.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generate synthetic corpus
        run: npm run corpus
      - name: Page smoke test on the built site
        run: |
          node scripts/serve-dist.mjs dist 5173 > /tmp/serve-dist.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
      - name: Deploy Pages site
        run: npx wrangler pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'email-my-deck' }}
